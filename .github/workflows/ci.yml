name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, chore/portfolio-hardening]

permissions:
  contents: read

jobs:
  server:
    name: Server build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Start MongoDB replica set for integration tests
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: '7.0'
          mongodb-replica-set: test-rs
      - name: Test transactional inventory cleanup
        run: npm test
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/baby-shop-test?replicaSet=test-rs

  client:
    name: Client build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Test signed Stripe webhook handling
        run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_API_ENDPOINT: http://localhost:5000/api
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_PUBLIC_APP_ENV: development
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          STRIPE_WEBHOOK_SYNC_SECRET: ci_placeholder_secret

  admin:
    name: Admin build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
